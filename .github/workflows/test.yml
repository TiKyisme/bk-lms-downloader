name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Test
        run: pytest

  # Manual, branch-restricted lifecycle test. It installs packages on an
  # administrator-capable hosted runner, so it must never run automatically
  # for pull requests (especially untrusted forks).
  store-msix-lifecycle:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/store-launch-shortcut'
    runs-on: windows-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and test dependencies
        shell: powershell
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Build and test signed MSIX lifecycle
        shell: powershell
        run: ./tools/validate_store_msix_lifecycle.ps1
