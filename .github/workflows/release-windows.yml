name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install ".[dev]"

      - name: Validate source and tag versions
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python tools/validate_versions.py --tag "$GITHUB_REF_NAME"
          else
            python tools/validate_versions.py
          fi

      - name: Compile source and tools
        run: python -m compileall -q src tools app.py

      - name: Run full test suite
        run: python -m pytest

  build-windows:
    needs: validate
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install ".[dev]"

      - name: Build Windows EXE
        run: python tools/build_desktop.py

      - name: Verify branded Windows icon
        shell: pwsh
        run: |
          ./scripts/verify_windows_icon.ps1 `
            -ExePath ./dist/BK-LMS-Downloader.exe `
            -SourcePngPath ./BK-LMS-Downloader-icon-blue.png

      - name: Validate packaged AI Study Pack runtime
        shell: pwsh
        run: |
          $selfTest = Start-Process `
            -FilePath ./dist/BK-LMS-Downloader.exe `
            -ArgumentList "--self-test-ai" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) {
            if (Test-Path "ai-self-test-error.log") {
              Get-Content "ai-self-test-error.log"
            }
            throw "Packaged AI Study Pack validation failed."
          }

      - name: Validate packaged sync timeout recovery
        shell: pwsh
        run: |
          $syncTest = Start-Process `
            -FilePath ./dist/BK-LMS-Downloader.exe `
            -ArgumentList "--self-test-sync" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($syncTest.ExitCode -ne 0) {
            if (Test-Path "sync-self-test-error.log") {
              Get-Content "sync-self-test-error.log"
            }
            throw "Packaged sync timeout recovery validation failed."
          }

      - name: Validate packaged GUI runtime
        shell: pwsh
        run: |
          $scrollTest = Start-Process `
            -FilePath ./dist/BK-LMS-Downloader.exe `
            -ArgumentList "--self-test-scroll" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($scrollTest.ExitCode -ne 0) {
            if (Test-Path "scroll-self-test-error.log") {
              Get-Content "scroll-self-test-error.log"
            }
            throw "Packaged GUI scroll/layout validation failed."
          }

      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist/BK-LMS-Downloader.exe release-assets/BK-LMS-Downloader-Windows.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: release-assets/BK-LMS-Downloader-Windows.exe

  build-macos-arm64:
    needs: validate
    runs-on: macos-14

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Apple Silicon DMG
        run: |
          chmod +x scripts/build_macos.sh
          BKLMS_SKIP_TESTS=1 scripts/build_macos.sh arm64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-arm64
          path: dist/BK-LMS-Downloader-macOS-arm64.dmg

  build-macos-x64:
    needs: validate
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Intel Mac DMG
        run: |
          chmod +x scripts/build_macos.sh
          BKLMS_SKIP_TESTS=1 scripts/build_macos.sh x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-x64
          path: dist/BK-LMS-Downloader-macOS-x64.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate release checksums
        run: |
          cd release-assets
          sha256sum \
            BK-LMS-Downloader-Windows.exe \
            BK-LMS-Downloader-macOS-arm64.dmg \
            BK-LMS-Downloader-macOS-x64.dmg > SHA256SUMS.txt

      - name: Create one GitHub Release with all platform assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: release-assets/*
