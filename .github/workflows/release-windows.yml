name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "BK-LMS-Downloader" `
            --paths "src" `
            --collect-submodules bklms_downloader `
            --collect-all customtkinter `
            --hidden-import markdownify `
            --hidden-import pypdf `
            --hidden-import pptx `
            --collect-all selenium `
            --add-data "tools/prepare_ai_course.py;tools" `
            "app.py"

      - name: Validate packaged AI Study Pack runtime
        shell: pwsh
        run: |
          $selfTest = Start-Process `
            -FilePath ./dist/BK-LMS-Downloader.exe `
            -ArgumentList "--self-test-ai" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) {
            if (Test-Path "ai-self-test-error.log") {
              Get-Content "ai-self-test-error.log"
            }
            throw "Packaged AI Study Pack validation failed."
          }

      - name: Validate packaged sync timeout recovery
        shell: pwsh
        run: |
          $syncTest = Start-Process `
            -FilePath ./dist/BK-LMS-Downloader.exe `
            -ArgumentList "--self-test-sync" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($syncTest.ExitCode -ne 0) {
            if (Test-Path "sync-self-test-error.log") {
              Get-Content "sync-self-test-error.log"
            }
            throw "Packaged sync timeout recovery validation failed."
          }

      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist/BK-LMS-Downloader.exe release-assets/BK-LMS-Downloader-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/BK-LMS-Downloader-Windows.exe

  build-macos-arm64:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Apple Silicon DMG
        run: |
          chmod +x scripts/build_macos.sh
          scripts/build_macos.sh arm64

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/BK-LMS-Downloader-macOS-arm64.dmg

  build-macos-x64:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Intel Mac DMG
        run: |
          chmod +x scripts/build_macos.sh
          scripts/build_macos.sh x64

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: dist/BK-LMS-Downloader-macOS-x64.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create one GitHub Release with all platform assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
