name: build-windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "BK-LMS-Downloader" `
            --paths "src" `
            --collect-submodules bklms_downloader `
            --collect-all customtkinter `
            --hidden-import markdownify `
            --hidden-import pypdf `
            --hidden-import pptx `
            --collect-all selenium `
            --add-data "tools/prepare_ai_course.py;tools" `
            "app.py"

      - name: Validate packaged AI Study Pack runtime
        shell: pwsh
        run: |
          $selfTest = Start-Process `
            -FilePath ./dist/BK-LMS-Downloader.exe `
            -ArgumentList "--self-test-ai" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) {
            if (Test-Path "ai-self-test-error.log") {
              Get-Content "ai-self-test-error.log"
            }
            throw "Packaged AI Study Pack validation failed."
          }

      - name: Validate packaged sync timeout recovery
        shell: pwsh
        run: |
          $syncTest = Start-Process `
            -FilePath ./dist/BK-LMS-Downloader.exe `
            -ArgumentList "--self-test-sync" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($syncTest.ExitCode -ne 0) {
            if (Test-Path "sync-self-test-error.log") {
              Get-Content "sync-self-test-error.log"
            }
            throw "Packaged sync timeout recovery validation failed."
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BK-LMS-Downloader-Windows
          path: dist/BK-LMS-Downloader.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/BK-LMS-Downloader.exe
